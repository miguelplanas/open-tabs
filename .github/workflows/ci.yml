name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          OPENTABS_DB: /tmp/test.db

  # Merging is deploying: on pushes to main, once test is green. The shared
  # workflow joins the tailnet (prod has no public address), queues the deploy
  # and waits until Dokploy reports done or error, so green means live.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: miguelplanas/ci/.github/workflows/deploy-dokploy.yml@main
    with:
      app-id: ${{ vars.DOKPLOY_APP_ID }}
    secrets: inherit
