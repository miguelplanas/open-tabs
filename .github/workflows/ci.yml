name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          OPENTABS_DB: /tmp/test.db

  deploy:
    # Merging is deploying. Only on pushes to main, and only once test is green.
    #
    # prod has no public address: it answers on a Tailscale name that resolves
    # into 100.64.0.0/10, so GitHub cannot reach it from the open internet.
    # That is why the old deploy job was removed (#3), and why pointing the
    # Dokploy GitHub App's webhook at http://prod:3000 never delivered. The
    # fix is to bring the runner into the tailnet as an ephemeral tagged node
    # instead of exposing prod, then poke Dokploy's deploy hook from inside.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Until the three secrets exist this job succeeds without doing anything,
      # so an unconfigured repo does not paint main red on every merge.
      - id: cfg
        name: Are the deploy secrets configured?
        env:
          CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          DEPLOY_URL: ${{ secrets.DOKPLOY_DEPLOY_URL }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$CLIENT_SECRET" ] && [ -n "$DEPLOY_URL" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Deploy secrets not set yet, skipping the deploy step.'
          fi

      - name: Join the tailnet
        if: steps.cfg.outputs.ready == 'true'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Ask Dokploy to redeploy
        if: steps.cfg.outputs.ready == 'true'
        env:
          DEPLOY_URL: ${{ secrets.DOKPLOY_DEPLOY_URL }}
          REF: ${{ github.ref }}
        # Dokploy reads the branch out of the webhook payload and refuses
        # anything that does not match the branch the app is configured with,
        # so the push event has to be reproduced: an empty POST just earns a
        # {"message":"Branch Not Match"}.
        #
        # That refusal comes back as HTTP 200, so the status code says nothing
        # about whether a deploy actually started. The body is the only signal,
        # which is why it is inspected rather than discarded: a deploy that
        # never ran must not report success.
        run: |
          body=$(curl -sS --max-time 60 -X POST "$DEPLOY_URL" \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            -d "{\"ref\":\"$REF\"}")
          echo "Dokploy answered: $body"
          case "$body" in
            *"Not Match"*|*nauthorized*|*"not found"*|*'"error"'*)
              echo "::error::Dokploy refused the deploy: $body"
              exit 1
              ;;
          esac
          echo "Deploy queued. It is live once Dokploy finishes the build."
