<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Folio: an open songbook whose ruled lines are the six strings, thin
       treble to thick bass. The pages taper toward the spine, so the strings
       aim at a vanishing point far off-canvas: true perspective, but distant
       enough that they read as a parallel set rather than a splay. Palette is
       the app's own (paper --bg, pine --accent); the stroke on the pages is
       what rounds their corners. -->
  <rect width="512" height="512" rx="114" fill="#f6f1e7"/>
  <g fill="#2f6e5b" stroke="#2f6e5b" stroke-width="12" stroke-linejoin="round">
    <path d="M102 150 L245 170 L245 342 L102 362 Z"/>
    <path d="M410 150 L267 170 L267 342 L410 362 Z"/>
  </g>
  <g stroke="#f6f1e7" stroke-linecap="round" fill="none">
    <line x1="110" y1="177.3" x2="239" y2="189.2" stroke-width="3.4"/>
    <line x1="110" y1="208.8" x2="239" y2="215.9" stroke-width="4.1"/>
    <line x1="110" y1="240.3" x2="239" y2="242.6" stroke-width="4.9"/>
    <line x1="110" y1="271.7" x2="239" y2="269.4" stroke-width="5.8"/>
    <line x1="110" y1="303.2" x2="239" y2="296.1" stroke-width="6.8"/>
    <line x1="110" y1="334.7" x2="239" y2="322.8" stroke-width="8"/>
    <line x1="402" y1="177.3" x2="273" y2="189.2" stroke-width="3.4"/>
    <line x1="402" y1="208.8" x2="273" y2="215.9" stroke-width="4.1"/>
    <line x1="402" y1="240.3" x2="273" y2="242.6" stroke-width="4.9"/>
    <line x1="402" y1="271.7" x2="273" y2="269.4" stroke-width="5.8"/>
    <line x1="402" y1="303.2" x2="273" y2="296.1" stroke-width="6.8"/>
    <line x1="402" y1="334.7" x2="273" y2="322.8" stroke-width="8"/>
  </g>
</svg>
