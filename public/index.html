<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f1e7">
  <meta name="theme-color" content="#15171a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>OpenTabs</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <!-- The ?v= is load-bearing: browsers key the favicon cache by URL and hold
       it far longer than the page cache, so a redrawn icon at the same URL
       keeps showing the old one. Bump it whenever the icons change. -->
  <link rel="icon" href="/icons/icon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-180.png?v=2">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
